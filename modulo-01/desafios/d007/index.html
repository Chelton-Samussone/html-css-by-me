<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da imagem flexível</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar melhor a experiência 🤯</p>
    <picture>
        <source media="(min-width: 1200px)" srcset="imagens/paisagem-g.png" type="image/png">
        <source media="(min-width: 740px)" srcset="imagens/paisagem-m.png" type="image/png">
        <img src="imagens/paisagem-p.png" alt="Jovem miúda de costas com cabelos encaracolados, bulusa preta e calças brancas, contemplando a paisagem nas montanhas de braços abertos">
    </picture>
</body>
</html>
