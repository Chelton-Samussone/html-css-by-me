<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <thead>
            <th>
                Estado
            </th>
            <th>
                População
            </th>
        </thead>
        <tbody>
            <td>São Paulo</td>
            <td>45 919 049</td>
        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
